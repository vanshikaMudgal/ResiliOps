services:
  # 1. FastAPI Backend & Self-Healing Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: resiliops-backend:latest
    container_name: resiliops-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:////data/resiliops.db
      - FRONTEND_ORIGIN=http://localhost:5173
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      # Mount Docker socket so backend can restart sample containers during self-healing
      - /var/run/docker.sock:/var/run/docker.sock
      - sqlite_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - resiliops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # 2. React Dashboard served via Production Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: resiliops-frontend:latest
    container_name: resiliops-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - resiliops-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  # 3. Standalone Monitored & Self-Healing Microservice Target
  sample-app:
    build:
      context: ./sample_app
      dockerfile: Dockerfile
    image: resiliops-sample-app:latest
    container_name: resiliops-sample-app
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - PORT=8000
    networks:
      - resiliops-network

  # 4. Prometheus Metrics Scraper
  prometheus:
    image: prom/prometheus:latest
    container_name: resiliops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_started
    networks:
      - resiliops-network

  # 5. Grafana Visualization Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: resiliops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/resiliops-dashboard.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - resiliops-network

networks:
  resiliops-network:
    name: resiliops-network
    driver: bridge

volumes:
  sqlite_data:
  prometheus_data:
  grafana_data:
