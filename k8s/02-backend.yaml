apiVersion: apps/v1
kind: Deployment
metadata:
  name: resiliops-backend
  namespace: resiliops
  labels:
    app: resiliops-backend
    tier: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resiliops-backend
  template:
    metadata:
      labels:
        app: resiliops-backend
    spec:
      containers:
        - name: backend
          image: resiliops-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: resiliops-config
          resources:
            requests:
              cpu: "150m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: backend-data
              mountPath: /data
      volumes:
        - name: backend-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: resiliops-backend-svc
  namespace: resiliops
  labels:
    app: resiliops-backend
spec:
  type: ClusterIP
  selector:
    app: resiliops-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000

