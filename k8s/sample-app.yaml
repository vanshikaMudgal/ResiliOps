apiVersion: apps/v1
kind: Deployment
metadata:
  name: resiliops-sample-app
  namespace: default
  labels:
    app: resiliops-sample-app
    tier: microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resiliops-sample-app
  template:
    metadata:
      labels:
        app: resiliops-sample-app
    spec:
      containers:
        - name: sample-microservice
          image: resiliops-sample-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: resiliops-sample-app-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: resiliops-sample-app
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080

