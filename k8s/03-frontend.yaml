apiVersion: apps/v1
kind: Deployment
metadata:
  name: resiliops-frontend
  namespace: resiliops
  labels:
    app: resiliops-frontend
    tier: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resiliops-frontend
  template:
    metadata:
      labels:
        app: resiliops-frontend
    spec:
      containers:
        - name: frontend
          image: resiliops-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: resiliops-frontend-svc
  namespace: resiliops
  labels:
    app: resiliops-frontend
spec:
  type: NodePort
  selector:
    app: resiliops-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30081

