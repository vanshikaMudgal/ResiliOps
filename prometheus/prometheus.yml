# ResiliOps - Prometheus Monitoring Configuration
global:
  scrape_interval: 5s       # Scrape metrics every 5 seconds for responsive college demo
  evaluation_interval: 5s

scrape_configs:
  - job_name: "resiliops-backend"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["backend:8000", "host.docker.internal:8000"]
        labels:
          environment: "docker-compose"
          platform: "resiliops"
